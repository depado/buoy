name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  golang:
    name: Golang
    permissions:
      contents: write
      pull-requests: write
      checks: write
    uses: depado/github-actions/.github/workflows/golang.yml@main

  docker:
    name: Docker
    needs: [golang]
    permissions:
      contents: read
      packages: write
      actions: read
    uses: depado/github-actions/.github/workflows/docker.yml@main
    with:
      platforms: linux/amd64,linux/arm64
      target: distroless
      enable-cleanup: false

  docker-alpine:
    name: Docker (alpine)
    needs: [golang]
    permissions:
      contents: read
      packages: write
      actions: read
    uses: depado/github-actions/.github/workflows/docker.yml@main
    with:
      platforms: linux/amd64,linux/arm64
      target: alpine
      tag-suffix: "-alpine"
      enable-cleanup: false

  container-retention-policy:
    name: Container Retention Policy
    if: github.event_name != 'pull_request'
    needs: [docker, docker-alpine]
    permissions:
      packages: write
    uses: depado/github-actions/.github/workflows/container-retention-policy.yml@main
