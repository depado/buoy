services:
  buoy:
    image: ghcr.io/depado/buoy:latest@sha256:58f2978ae992d8a05538b5f80aa62333972f0f1f135ed91e90e685e5f1e99449
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
      - buoy_data:/data
    environment:
      - BUOY_RESTIC_PASSWORD=${RESTIC_PASSWORD:?RESTIC_PASSWORD must be set}
      - BUOY_RESTIC_REPOS=/backup
      - BUOY_DAEMON_CONCURRENCY=2
    restart: unless-stopped

volumes:
  buoy_data:
