version: 2

project_name: buoy

before:
  hooks:
    - go mod tidy
    - go mod verify
    - go build ./...
    - go vet ./...

builds:
  - id: buoy
    main: ./cmd/buoy
    binary: buoy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X "github.com/depado/buoy/cmd/version.Version={{ .Version }}"
      - -X "github.com/depado/buoy/cmd/version.Build={{ .Commit }}"
      - -X "github.com/depado/buoy/cmd/version.BuildDate={{ .Date }}"
  - id: buoyctl
    main: ./cmd/buoyctl
    binary: buoyctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X "github.com/depado/buoy/cmd/version.Version={{ .Version }}"
      - -X "github.com/depado/buoy/cmd/version.Build={{ .Commit }}"
      - -X "github.com/depado/buoy/cmd/version.BuildDate={{ .Date }}"

archives:
  - id: buoy
    builds: [buoy]
    formats: ["tar.gz"]
    name_template: >-
      buoy_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
  - id: buoyctl
    builds: [buoyctl]
    formats: ["tar.gz"]
    format_overrides:
      - goos: windows
        formats: ["zip"]
    name_template: >-
      buoyctl_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

source:
  enabled: true
  name_template: "{{ .ProjectName }}-{{ .Version }}-source"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  abbrev: 0
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Refactors
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Others
      order: 999
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - merge conflict
      - Merge pull request

release:
  github:
    owner: depado
    name: buoy
  draft: false
  prerelease: auto
  mode: replace
  name_template: "v{{ .Version }}"
  header: |
    ## buoy {{ .Version }}

    Backup Docker container volumes and bind mounts using restic as the backend.

    ### Quick Install

    ```bash
    # Download daemon binary
    curl -sSL "https://github.com/depado/buoy/releases/download/v{{ .Version }}/buoy_Linux_x86_64.tar.gz" | tar xz

    # Download CLI
    curl -sSL "https://github.com/depado/buoy/releases/download/v{{ .Version }}/buoyctl_$(go env GOOS)_x86_64.tar.gz" | tar xz

    # Or via Go
    go install github.com/depado/buoy/cmd/buoy@v{{ .Version }}
    go install github.com/depado/buoy/cmd/buoyctl@v{{ .Version }}
    ```

    ### Docker

    ```bash
    docker pull ghcr.io/depado/buoy:{{ .Version }}
    ```

git:
  ignore_tags:
    - nightly
  tag_sort: -version:refname

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
